<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>نوشتن شرح حال با صدا | هوش‌طب</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f6f5;color:#173b43;font:16px/1.9 Tahoma,Arial,sans-serif}main{max-width:800px;margin:24px auto;background:white;border:1px solid #d6e5e3;border-radius:16px;padding:22px}h1{font-size:24px}.notice{background:#e7f4f1;border-radius:9px;padding:12px}.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.meter{height:4px;background:#dce8e6;border-radius:4px;overflow:hidden}.meter span{display:block;height:100%;background:#088582;transform-origin:right;transform:scaleX(0)}textarea,button{font:inherit}textarea{width:100%;min-height:220px;padding:12px;border:1px solid #b8cece;border-radius:10px}button{background:#087f82;color:white;border:0;border-radius:9px;padding:9px 16px}button.secondary{background:#e4efee;color:#19444b}button:disabled{opacity:.5}#status{font-weight:bold;color:#075e64}#interim,small{color:#637779}#diag,#status{white-space:pre-wrap}details{margin-top:16px}@media(max-width:600px){main{margin:0;padding:16px}}
</style></head><body><main><h1>هوش‌طب · نوشتن با صدا</h1>
<p class="notice">«شروع صحبت» را بزنید و فارسی صحبت کنید. پس از مکث، متن را بررسی کنید. برای افزودن جملهٔ بعد دوباره شروع کنید. سرویس گفتار مرورگر ممکن است صدا را برای پردازش به سرور خود بفرستد.</p>
<div class="row"><button id="start">🎙 شروع صحبت</button><button class="secondary" id="stop" disabled>توقف</button></div>
<div class="meter" aria-hidden="true"><span id="bar"></span></div>
<p id="status" role="status"></p><p id="interim"></p>
<label for="text">متن قابل ویرایش</label><textarea id="text" maxlength="1500"></textarea><small id="count"></small>
<div class="row"><button id="transfer" disabled>انتقال به شرح حال</button><button id="copy" class="secondary">کپی متن</button><button id="back" class="secondary">بازگشت به فرم بیمار</button></div>
<p class="notice" id="connection"></p><small>پس از انتقال، در فرم بیمار «ثبت پیام» را بزنید.</small>
<details><summary>جزئیات فنی برای بررسی مشکل</summary><div id="diag"></div></details></main>
<script>
'use strict';
const $=id=>document.getElementById(id), Engine=window.SpeechRecognition||window.webkitSpeechRecognition;
const parentTab=window.opener, request=new URLSearchParams(location.hash.slice(1)).get('request');
let origin='',sent=false,waiting=false,ack,active=null;
const logs=[];
function log(msg){logs.push(new Date().toLocaleTimeString('fa-IR')+' — '+msg);if(logs.length>30)logs.shift();$('diag').textContent=logs.join('\n');}
function ui(){ $('start').disabled=!Engine||!isSecureContext||!!active||waiting||sent;
 $('stop').disabled=!active||active.stopping; $('transfer').disabled=!origin||!!active||waiting||sent||!$('text').value.trim();
 $('text').readOnly=waiting||sent;$('count').textContent=$('text').value.length.toLocaleString('fa-IR')+' / ۱۵۰۰';}
function releaseMeter(s){s.meterOff=true;cancelAnimationFrame(s.frame);if(s.stream)s.stream.getTracks().forEach(t=>t.stop());s.stream=null;
 if(s.ctx&&s.ctx.state!=='closed')s.ctx.close().catch(()=>{});s.ctx=null;$('bar').style.transform='scaleX(0)';}
async function startMeter(s){
 try{
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC||!navigator.mediaDevices)return;
 const ctx=s.ctx=new AC();
 await ctx.resume();
 if(active!==s||s.meterOff)return;
 const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
 if(active!==s||s.meterOff){stream.getTracks().forEach(t=>t.stop());return;}
 s.stream=stream;const src=s.src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);
 const samples=new Float32Array(an.fftSize);
 function draw(){if(active!==s||s.meterOff)return;an.getFloatTimeDomainData(samples);let sum=0;for(const x of samples)sum+=x*x;
 const db=20*Math.log10(Math.max(0.000001,Math.sqrt(sum/samples.length)));
 $('bar').style.transform='scaleX('+Math.max(0,Math.min(1,(db+75)/65))+')';s.frame=requestAnimationFrame(draw);}draw();
 }catch(e){if(active===s){releaseMeter(s);log('نمایش نوار در دسترس نیست: '+e.name);}}
}
function finish(s,msg,abort){if(active!==s)return;active=null;clearTimeout(s.timer);releaseMeter(s);
 if(abort)try{s.r.abort();}catch(e){} $('status').textContent=msg;ui();}
function stop(reason){const s=active;if(!s||s.stopping)return;s.stopping=true;clearTimeout(s.timer);releaseMeter(s);ui();log(reason);
 $('status').textContent='منتظر نتیجهٔ نهایی…';
 s.timer=setTimeout(()=>finish(s,'نتیجه نهایی دریافت نشد؛ متن قبلی حفظ شده است.',true),6000);
 try{s.r.stop();}catch(e){finish(s,'دریافت صدا متوقف شد.',true);}}
$('start').onclick=()=>{
 if(active||sent||waiting||!Engine)return;
 if($('text').value.length>=1500){$('status').textContent='سقف ۱۵۰۰ کاراکتر تکمیل شده است.';return;}
 let r;try{r=new Engine();}catch(e){$('status').textContent='تشخیص گفتار در دسترس نیست.';return;}
 const s=active={r,seen:new Set(),phase:'درخواست شروع',stopping:false,meterOff:false,final:false,full:false};
 r.lang='fa-IR';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
 function phase(msg){if(active!==s||s.stopping)return;s.phase=msg;log(msg);$('status').textContent=msg;}
 $('interim').textContent='';phase('در انتظار شروع میکروفن…');ui();
 s.timer=setTimeout(()=>finish(s,'مهلت شروع تشخیص گفتار پایان یافت.',true),30000);
 r.onstart=()=>{if(active!==s||s.stopping)return;clearTimeout(s.timer);phase('فارسی صحبت کنید.');s.timer=setTimeout(()=>stop('توقف خودکار پس از ۶۰ ثانیه'),60000);};
 r.onaudiostart=()=>{if(active!==s||s.stopping)return;phase('دریافت صدا آغاز شد.');if(!s.meterStarted){s.meterStarted=true;startMeter(s);}};
 r.onsoundstart=()=>phase('صدا شناسایی شد.');r.onspeechstart=()=>phase('گفتار شناسایی شد.');
 r.onaudioend=()=>{if(active===s)releaseMeter(s);};
 r.onresult=e=>{if(active!==s)return;const temp=[];
 for(let i=0;i<e.results.length;i++){const item=e.results[i],v=item[0].transcript.trim();if(!item.isFinal){temp.push(v);continue;}if(!v||s.seen.has(i))continue;s.seen.add(i);
 const t=$('text'),add=(t.value&&!/\s$/.test(t.value)?' ':'')+v,n=1500-t.value.length;t.value+=add.slice(0,n);s.final=true;log('متن نهایی دریافت شد');if(add.length>=n){s.full=true;stop('سقف متن تکمیل شد');break;}}
 $('interim').textContent=temp.join(' ');ui();};
 r.onerror=e=>{if(active!==s)return;log('خطای تشخیص گفتار: '+e.error+'؛ آخرین مرحله: '+s.phase);
 const msgs={'not-allowed':'دسترسی میکروفن مجاز نیست.','network':'ارتباط با سرویس گفتار برقرار نشد.','audio-capture':'میکروفن در دسترس نیست.','no-speech':'گفتاری دریافت نشد.','language-not-supported':'زبان فارسی در این سرویس پشتیبانی نمی‌شود.','aborted':'تشخیص گفتار متوقف شد.'};
 finish(s,(msgs[e.error]||'تشخیص گفتار ناموفق بود.')+' کد: '+e.error,true);};
 r.onend=()=>{if(active!==s)return;log('پایان؛ آخرین مرحله: '+s.phase);finish(s,s.full?'سقف ۱۵۰۰ کاراکتر تکمیل شد.':s.final?'متن آمادهٔ بررسی است.':$('interim').textContent?'فقط متن موقت دریافت شد.':'متنی دریافت نشد؛ دوباره شروع کنید.',false);};
 try{r.start();}catch(e){finish(s,'شروع گفتار ناموفق بود: '+e.name,true);}
};
$('stop').onclick=()=>stop('توقف با دکمه');$('text').oninput=ui;
const allowed=o=>o==='https://script.google.com'||o==='https://script.googleusercontent.com'||/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o);
let poll,deadline;
function ready(){if(parentTab&&request&&!origin)parentTab.postMessage({type:'HT_VOICE_READY',request},'*');}
window.addEventListener('message',e=>{const d=e.data;if(!request||!parentTab||e.source!==parentTab||!allowed(e.origin)||!d||d.request!==request)return;
 if(d.type==='HT_VOICE_INIT'&&(!origin||origin===e.origin)){origin=e.origin;clearInterval(poll);clearTimeout(deadline);$('connection').textContent='به فرم بیمار متصل است.';}
 if(d.type==='HT_VOICE_ACK'&&e.origin===origin&&waiting){clearTimeout(ack);waiting=false;sent=d.ok===true;$('connection').textContent=d.message||'پاسخ فرم دریافت شد.';}ui();});
$('transfer').onclick=()=>{if($('transfer').disabled)return;waiting=true;ui();
 try{if(parentTab.closed)throw Error();parentTab.postMessage({type:'HT_VOICE_TEXT',request,text:$('text').value.trim()},origin);
 $('connection').textContent='در حال انتقال…';ack=setTimeout(()=>{waiting=false;ui();$('connection').textContent='تأیید دریافت نشد؛ فرم بیمار را بررسی کنید یا متن را کپی کنید.';},6000);}
 catch(e){waiting=false;ui();$('connection').textContent='فرم بسته شده است؛ متن را کپی کنید.';}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('text').value);$('connection').textContent='متن کپی شد.';}catch(e){$('text').focus();$('text').select();$('connection').textContent='گزینهٔ کپی را بزنید.';}};
$('back').onclick=()=>{if(!sent&&$('text').value.trim()&&!confirm('متن هنوز منتقل نشده است. صفحه بسته شود؟'))return;if(active)finish(active,'متوقف شد.',true);
 if(parentTab){parentTab.focus();window.close();}$('connection').textContent='به تب فرم بیمار برگردید.';};
window.addEventListener('pagehide',()=>{if(active)finish(active,'متوقف شد.',true);clearInterval(poll);clearTimeout(deadline);clearTimeout(ack);});
if(parentTab&&request){$('connection').textContent='در حال اتصال به فرم بیمار…';poll=setInterval(ready,700);deadline=setTimeout(()=>{clearInterval(poll);if(!origin)$('connection').textContent='اتصال برقرار نشد؛ متن را کپی کنید.';},15000);ready();}
else $('connection').textContent='صفحه مستقل باز شده است؛ برای انتقال خودکار از فرم بیمار وارد شوید.';
$('status').textContent=!isSecureContext?'صفحه را با HTTPS باز کنید.':!Engine?'تشخیص گفتار در این مرورگر در دسترس نیست.':'برای نوشتن، شروع صحبت را بزنید.';log('نسخه: voice-meter-3');ui();
</script></body></html>
