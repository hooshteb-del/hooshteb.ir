<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به ویزیت هوشمند آفلاین - هوش‌طب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }

        .login-header h2 {
            color: #1a1a2e;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group input.error {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        /* ✅ استایل لینک فراموشی رمز */
        .forgot-password-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            display: inline-block;
            transition: color 0.3s ease;
            font-weight: 600;
        }

        .forgot-password-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* ✅ استایل بخش بازشونده فراموشی رمز */
        .forgot-section {
            display: none;
            background: #f8f9fa;
            padding: 18px;
            border-radius: 10px;
            margin-top: 12px;
            border-right: 4px solid #667eea;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .forgot-section.show {
            display: block;
        }

        .forgot-section .form-group {
            margin-bottom: 12px;
        }

        .forgot-section .form-group label {
            font-size: 13px;
            color: #555;
        }

        .forgot-section .form-group input {
            padding: 10px 12px;
            font-size: 13px;
            border: 1px solid #ddd;
        }

        .forgot-section .form-group input:focus {
            border-color: #667eea;
        }

        .btn-forgot-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
            font-family: inherit;
        }

        .btn-forgot-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-forgot-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .forgot-message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 13px;
        }

        .forgot-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .forgot-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .forgot-message.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .captcha-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 5px;
            border: 2px solid #e0e0e0;
        }

        .captcha-text {
            font-size: 28px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            letter-spacing: 8px;
            color: #2d3436;
            background: white;
            padding: 5px 15px;
            border-radius: 8px;
            user-select: none;
            min-width: 120px;
            text-align: center;
        }

        .captcha-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .captcha-actions button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .captcha-actions button:hover {
            background: #5a6fd6;
            transform: scale(1.05);
        }

        .captcha-input {
            margin-top: 10px;
        }

        .captcha-input input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #f8f9fa;
        }

        .captcha-input input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .captcha-input input.error {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-family: inherit;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-login i {
            margin-left: 8px;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            text-align: center;
            padding: 10px;
            background: #fff5f5;
            border-radius: 8px;
            border: 1px solid #fcc;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #27ae60;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            text-align: center;
            padding: 10px;
            background: #f0fff4;
            border-radius: 8px;
            border: 1px solid #b2dfdb;
        }

        .success-message.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease-in-out infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #333;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
                margin: 15px;
            }

            .captcha-text {
                font-size: 22px;
                letter-spacing: 5px;
                min-width: 90px;
            }

            .login-header h2 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <button class="close-btn" onclick="closeLogin()" style="display:none">✕</button>
        
        <div class="login-header">
            <img src="assets/logoenter.png" alt="هوش‌طب" />
            <h2 id="header_h2">ورود به ویزیت هوشمند آفلاین</h2>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <div class="form-group" id="radio_group_list">
                <div style="display: flex; gap: 15px; margin-top: 5px; flex-wrap: wrap;">
                    <label sty             * le="font-weight: normal;">
                        <input type="radio" id="user_type1" name="user_type" value="1" onclick="user_type_onclick(1)" checked />
                        پزشک
                    </label>
                    <label style="font-weight: normal;">
                        <input type="radio" id="user_type2" name="user_type" value="2" onclick="user_type_onclick(2)" />
                        مدیر داخلی
                    </label>
                    <label style="font-weight: normal;">
                        <input type="radio" id="user_type3" name="user_type" value="3" onclick="user_type_onclick(3)" />
                        دستیار پزشک
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="username" id="label_username">نام کاربری</label>
                <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید" required autocomplete="username" />
            </div>

            <div class="form-group">
                <label for="password" id="label_password">کلمه عبور</label>
                <input type="password" id="password" placeholder="کلمه عبور خود را وارد کنید" required autocomplete="current-password" />
            </div>

            <!-- ✅ بخش فراموشی رمز عبور -->
            <div class="form-group" id="forgotSectionHeader">
                <a href="#" class="forgot-password-link" onclick="toggleForgotSection(event)">
                    🔑 کلمه عبور خود را فراموش کرده‌اید؟
                </a>

                <!-- ✅ بخش بازشونده فراموشی رمز -->
                <div id="forgotSection" class="forgot-section">
                    <p style="font-size:13px; color:#666; margin-bottom:12px;">
                        برای بازیابی رمز عبور، شماره تلفن همراه و ایمیل خود را وارد کنید.
                    </p>

                    <div class="form-group">
                        <label for="forgotMobile">شماره تلفن همراه</label>
                        <input type="tel" id="forgotMobile" placeholder="شماره تلفن همراه را وارد کنید"  
                               inputmode="numeric" pattern="09[0-9]{9}" maxlength="11" />
                    </div>

                    <div class="form-group">
                        <label for="forgotEmail">ایمیل</label>
                        <input type="email" id="forgotEmail" placeholder="ایمیل خود را وارد کنید" dir="ltr">
                    </div>

                    <button type="button" class="btn-forgot-submit" onclick="sendForgotPassword()">
                        ارسال درخواست بازیابی رمز
                    </button>

                    <div id="forgotMessage" class="forgot-message"></div>
                </div>
            </div>

            <div class="form-group">
                <label>کد امنیتی (کپچا)</label>
                <div class="captcha-container">
                    <span class="captcha-text" id="captchaText"></span>
                    <div class="captcha-actions">
                        <button type="button" onclick="generateCaptcha()" title="تولید کد جدید">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                        <button type="button" onclick="speakCaptcha()" title="گوش دادن به کد">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>
                </div>
                <div class="captcha-input">
                    <input type="text" id="captchaInput" placeholder="کد امنیتی را وارد کنید" required autocomplete="off" />
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span id="loginBtnText">ورود به ویزیت هوشمند</span>
            </button>
        </form>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script>
        // ============================================================
        // تنظیمات
        // ============================================================
        var GAS_URL_DOCTORLIST = 'https://script.google.com/macros/s/AKfycby7PvgWgE1eOwMp-aqWqC93RAdwISS9QN6ubSjgWIJd2XeUxIbrBMOQ-a7mwRsSZKC-/exec'

        var GAS_URL_PATIENTALIST = 'https://script.google.com/macros/s/AKfycby9mPmsOgviCY5uYMW-Ci1-zfjXVZRMakbeCdHOgMiHAx7Dft2i4QzPCTkxMk4rObZ9Cw/exec'

        
        const SESSION_KEY = 'hooshteb_offline_session';
        const SESSION_PATIENT = 'SESSION_PATIENT';
        const DOCTOR_NAME_KEY = 'doctor_name';
        const DOCTOR_DATA_KEY = 'doctor_data';

        // ============================================================
        // تولید کپچا
        // ============================================================
        let currentCaptcha = '';

        // تابع کمکی برای تولید عدد تصادفی
        function getRandomInt(max) {
             return Math.floor(Math.random() * max);
        }

        function generateCaptcha() {
            let chars = '';
            let captcha = '';
            const lblisloginpezeshk = localStorage.getItem('isloginpezeshk');

            if (lblisloginpezeshk === "true") {
                chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                for (let i = 0; i < 6; i++) {
                    captcha += chars.charAt(Math.floor(Math.random() * chars.length));
                }
            }
            else {
                const chars = '0123456789';
                for (let i = 0; i < 5; i++) {
                    captcha += chars.charAt(Math.floor(Math.random() * chars.length));
                }
            }
            currentCaptcha = captcha;
            document.getElementById('captchaText').textContent = captcha;
            document.getElementById('captchaInput').value = '';
            document.getElementById('captchaInput').classList.remove('error');
        }

        function speakCaptcha() {
            if (!currentCaptcha) {
                generateCaptcha();
            }
            const utterance = new SpeechSynthesisUtterance(currentCaptcha.split('').join(' '));
            utterance.lang = 'fa-IR';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }

        // ============================================================
        // ✅ توابع نمایش/مخفی کردن بخش فراموشی رمز
        // ============================================================
        function toggleForgotSection(event) {
            event.preventDefault();

            const isDoctor =
                new URLSearchParams(window.location.search)
                    .get('isloginpezeshk') === 'true';

            if (!isDoctor) return;

            const section = document.getElementById('forgotSection');
            const mobile = document.getElementById('forgotMobile');
            const email = document.getElementById('forgotEmail');

            section.classList.toggle('show');

            const isVisible = section.classList.contains('show');

            mobile.disabled = !isVisible;
            email.disabled = !isVisible;

            mobile.required = isVisible;
            email.required = isVisible;

            document.getElementById('forgotMessage').textContent = '';

            if (isVisible) {
                mobile.focus();
            }
        }        
        // ============================================================
        // ✅ ارسال درخواست بازیابی رمز
        // ============================================================
        async function sendForgotPassword() {
            const mobile = document.getElementById('forgotMobile').value.trim();
            const email = document.getElementById('forgotEmail').value.trim();
            const messageDiv = document.getElementById('forgotMessage');
            const submitBtn = document.querySelector('.btn-forgot-submit');
            const reset_link = "https://hooshteb.ir"
            // اعتبارسنجی
            if (!mobile) {
                showForgotMessage('لطفاً شماره تلفن همراه را وارد کنید', 'error');
                document.getElementById('forgotMobile').focus();
                return;
            }
            
            if (!email) {
                showForgotMessage('لطفاً ایمیل خود را وارد کنید', 'error');
                document.getElementById('forgotEmail').focus();
                return;
            }
            
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showForgotMessage('لطفاً یک ایمیل معتبر وارد کنید', 'error');
                document.getElementById('forgotEmail').focus();
                return;
            }
            
            // غیرفعال کردن دکمه
            submitBtn.disabled = true;
            submitBtn.textContent = 'در حال ارسال...';
            showForgotMessage('در حال ارسال درخواست...', 'info');

            try {
                // ارسال به Apps Script
                const params = new URLSearchParams();
                params.append("action", "forgot_password");
                params.append("phonenumber", mobile);
                params.append("email", email);
                params.append("reset_link", reset_link);
                
                const response = await fetch(GAS_URL_DOCTORLIST, {
                    method: 'POST',
                    body: params
                });
                
                const result = await response.json();

                console.log('Server response:', result);
                
                if (result.success === true) {
                    showForgotMessage('✅ ' + result.message, 'success');
                    
                    // پاک کردن فیلدها بعد از موفقیت
                    document.getElementById('forgotMobile').value = '';
                    document.getElementById('forgotEmail').value = '';
                    
                    // بستن خودکار بخش بعد از 3 ثانیه
                    setTimeout(() => {
                        document.getElementById('forgotSection').classList.remove('show');
                    }, 3000);
                    
                } else {
                    showForgotMessage('❌ ' + result.message, 'error');
                }
                
            } catch (error) {
                showForgotMessage('❌ خطا در ارتباط با سرور: ' + error.message, 'error');
            } finally {
                // فعال کردن مجدد دکمه
                submitBtn.disabled = false;
                submitBtn.textContent = 'ارسال درخواست بازیابی رمز';
            }
        }

        // ============================================================
        // ✅ نمایش پیام در بخش فراموشی
        // ============================================================
        function showForgotMessage(text, type) {
            const messageDiv = document.getElementById('forgotMessage');
            messageDiv.textContent = text;
            messageDiv.className = 'forgot-message ' + type;
        }

        // ============================================================
        // نمایش پیام‌ها
        // ============================================================
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('show');
            document.getElementById('errorMessage').classList.remove('show');
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        // ============================================================
        // بررسی نشست قبلی
        // ============================================================
        function checkExistingSession() {
            try {
                const session = localStorage.getItem(SESSION_KEY);
                if (session) {
                    const data = JSON.parse(session);
                    if (data.username && data.timestamp) {
                        const now = Date.now();
                        const sessionAge = now - data.timestamp;
                        if (sessionAge < 8 * 60 * 60 * 1000) {
                            return data;
                        } else {
                            localStorage.removeItem(SESSION_KEY);
                            localStorage.removeItem(SESSION_PATIENT);
                            localStorage.removeItem(DOCTOR_NAME_KEY);
                            localStorage.removeItem(DOCTOR_DATA_KEY);
                        }
                    }
                }
            } catch (e) {
                console.error('Error checking session:', e);
            }
            return null;
        }

        // ============================================================
        // تعیین نوع کاربر ورودی
        // ============================================================
        function getSelectedUserType() {
            const radios = document.querySelectorAll('input[name="user_type"]');
            for (const radio of radios) {
                if (radio.checked) {
                    return radio.value;
                }
            }
            return null;
        }

        function getSelectedUserTypeCaption(usertype_value, usertype_default) {
            if (usertype_value == '2')
                return `مدیر مطب دکتر ${usertype_default} `
            else if (usertype_value == '3')
                return `دستیار محترم دکتر ${usertype_default}`
            else 
                return usertype_default
        }

        // ============================================================
        // تابع اصلی ورود به سیستم
        // ============================================================
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const captchaInput = document.getElementById('captchaInput').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            hideMessages();
            if (captchaInput.toLowerCase() !== currentCaptcha.toLowerCase()) {
                showError('❌ کد امنیتی اشتباه است.');
                document.getElementById('captchaInput').classList.add('error');
                generateCaptcha();
                return;
            }

            if (!username || !password) {
                showError('❌ لطفاً نام کاربری و کلمه عبور را وارد کنید.');
                if (!username) document.getElementById('username').classList.add('error');
                if (!password) document.getElementById('password').classList.add('error');
                return;
            }
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> در حال بررسی اطلاعات...';
            let sub_action = "doctorpage"
            const lblisloginpezeshk = localStorage.getItem('isloginpezeshk');
            let GAS_URL_LOCAL = GAS_URL_DOCTORLIST;
            let action_name = "loginDoctor";
            let user_type_value = getSelectedUserType();
            if (lblisloginpezeshk === "false") {
                GAS_URL_LOCAL = GAS_URL_PATIENTALIST
                action_name = "loginPatiant"
                user_type_value = "0"
            }
            const params = new URLSearchParams();
            params.append("action", action_name);
            params.append("usertype", user_type_value);
            params.append("username", username);
            params.append("password", password);
            //console.log("action", action_name)
            //console.log("usertype", user_type_value)
            //console.log("username", username)
            //console.log("password", password)
            await fetch(GAS_URL_LOCAL, {
                method: "POST",
                body: params
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("🌐 اینترنت وصل نیست یا سرعت آن کم است. 🔄 مجدداً تلاش کنید");
                }
                return response.json();
            })
            .then(data => {
                console.log("پاسخ سرور :", data);

                if (data.success) {
                    if (lblisloginpezeshk === "true") {
                        const doctor = data.doctor;
                        localStorage.setItem("SESSION_TOKEN", data.token);
                        localStorage.setItem("SESSION_USERTYPE", getSelectedUserType());
                        localStorage.setItem(SESSION_KEY, JSON.stringify({
                            token: data.token,
                            uid: doctor.uid,
                            usertype: getSelectedUserType(),
                            username: doctor.username,
                            loginTime: Date.now()
                        }));
                        localStorage.setItem(DOCTOR_NAME_KEY, doctor.fullname);
                        localStorage.setItem(DOCTOR_DATA_KEY, JSON.stringify(doctor));

                        showSuccess(`✅ ${getSelectedUserTypeCaption(user_type_value, doctor.fullname)} خوش آمدید`);

                        setTimeout(function () {
                            window.parent.postMessage({
                                action: "loginSuccess",
                                usertype: getSelectedUserType(),
                                uid: doctor.uid,
                                username: doctor.username
                            }, "*");
                        }, 2000);

                    }
                    else {
                        localStorage.setItem("SESSION_TOKEN", data.token);
                        localStorage.setItem("SESSION_USERTYPE", "0");
                        localStorage.setItem(SESSION_KEY, JSON.stringify({
                            token: data.token,
                            uid: data.uid,
                            usertype: "0",
                            username: data.patient.nationalid,
                            loginTime: Date.now()
                        }));
                        //localStorage.setItem(DOCTOR_NAME_KEY, doctor.fullname);
                        //localStorage.setItem(DOCTOR_DATA_KEY, JSON.stringify(doctor));
                        // ذخیره توکن
                        //localStorage.setItem("SESSION_TOKEN", data.token);

                        // ذخیره اطلاعات بیمار
                        localStorage.setItem(SESSION_PATIENT, JSON.stringify(data.patient));

                        // نمایش پیام موفقیت
                        showSuccess(`✅ ${data.patient.fullname} خوش آمدید`);

                        // ارسال پیام به parent (اگر در iframe هستید)
                        setTimeout(function () {
                            window.parent.postMessage({
                                action: "loginSuccess",
                                usertype: "0",
                                patient: data.patient
                            }, "*");
                        }, 2000);

                    }
                    
                    return;
                }

                showError("❌ " + data.message);
                document.getElementById("username").classList.add("error");
                document.getElementById("password").classList.add("error");
            })
            .catch(error => {
                console.error(error);
                showError("🌐 اینترنت وصل نیست یا سرعت آن کم است. 🔄 مجدداً تلاش کنید");
            })
            .finally(() => {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>ورود به ویزیت هوشمند</span>';
            });
        }

        // ============================================================
        // بستن پنجره لاگین
        // ============================================================
        function closeLogin() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage('closeLogin', '*');
            } else {
                window.close();
            }
        }
        onclick = "user_type_onclick(1)"

        function user_type_onclick(input_usertype) {
            if (input_usertype == "1")
                document.getElementById('forgotSectionHeader').style.display = 'block'
            else
                document.getElementById('forgotSectionHeader').style.display = 'none'
        }

            if (!session_usertype || session_usertype == "0")
               session_usertype = "1"
            
            if (isloginpezeshk === 'false') {
                session_usertype = "0"
                // غیرفعال کردن required از رادیو باتن‌ها
                document.querySelectorAll('input[name="user_type"]').forEach(radio => {
                    //alert(-130)
                    radio.removeAttribute('required');
                });
                const label_password = document.getElementById('label_password');
                const text_password = document.getElementById('password');

                const label_username = document.getElementById('label_username');
                const text_username = document.getElementById('username');

                const forgotHeader = document.getElementById('forgotSectionHeader');

                const forgotMobile = document.getElementById('forgotMobile');

                forgotHeader.style.display = 'none';
                forgotSection.classList.remove('show');

                forgotMobile.required = false;
                forgotEmail.required = false;
                forgotMobile.disabled = true;
                forgotEmail.disabled = true;

                /*
                document.body.style.cssText = "background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; margin: 0;";
                document.body.style.cssText = "background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; margin: 0;";

                document.body.style.cssText = "background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%); min-height: 100vh; margin: 0;";
                _loginBtn.style.cssText = "background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%); color: white; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;";

                document.body.style.cssText = "background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); min-height: 100vh; margin: 0;";;
                _loginBtn.style.cssText = "background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); color: white; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;";

                */
                document.body.style.cssText = "background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%); min-height: 100vh; margin: 0;";

                if (_radio_group_list) _radio_group_list.style.display = 'none';
                if (_header_h2) _header_h2.textContent = 'به هوش طب خوش آمدید';

                if (label_username) label_username.textContent = 'شماره ملی';
                if (text_username) text_username.placeholder = ' شماره ملی خود را وارد کنید';

            }

            document.getElementById('forgotSectionHeader').style.display = 'none'
            if (session_usertype)
            {
                document.getElementById('user_type1').checked = session_usertype == "1";

                if (session_usertype == "1")
                  document.getElementById('forgotSectionHeader').style.display = 'block'
            }

            document.getElementById('username').addEventListener('input', function() {
                this.classList.remove('error');
                hideMessages();
            });
            document.getElementById('password').addEventListener('input', function() {
                this.classList.remove('error');

            });
            document.getElementById('captchaInput').addEventListener('input', function() {

            document.getElementById('captchaInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            });

            // generateCaptcha
            generateCaptcha();
            // ✅ بستن بخش فراموشی با کلید ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    const section = document.getElementById('forgotSection');
                    if (section.classList.contains('show')) {
                        section.classList.remove('show');
                    }
                }
            });
